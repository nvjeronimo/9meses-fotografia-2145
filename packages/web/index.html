<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script src="/theme-init.js"></script>
		<link rel="preload" href="/fonts/lato-300.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/playfair-display-400.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="theme-color" content="#f7f4f1" />
		<meta name="author" content="9 Meses Fotografia" />
		<meta name="geo.region" content="PT-08" />
		<meta name="geo.placename" content="Ferreiras, Albufeira" />
		<!-- Per-page title, description, canonical, hreflang, OG and JSON-LD are
		     rendered by src/web/components/seo.tsx. These fallbacks (data-shell) serve
		     pages that were not pre-rendered; main.tsx swaps them out. -->
		<title data-shell>9 Meses Fotografia | Fotografia de Maternidade, Recém-Nascido e Família em Albufeira</title>
		<meta
			data-shell
			name="description"
			content="Estúdio de fotografia em Ferreiras, Albufeira. Sessões de maternidade, recém-nascido, bebé, família e smash the cake no Algarve."
		/>
		<meta data-shell property="og:type" content="website" />
		<meta data-shell property="og:site_name" content="9 Meses Fotografia" />
		<meta data-shell property="og:title" content="9 Meses Fotografia | Fotografia de Maternidade e Recém-Nascido em Albufeira" />
		<meta data-shell
			property="og:description"
			content="Estúdio de fotografia em Ferreiras, Albufeira. Sessões de maternidade, recém-nascido, bebé, família e smash the cake no Algarve."
		/>
		<meta data-shell property="og:url" content="https://9mesesfotografia.com/" />
		<meta data-shell property="og:image" content="https://9mesesfotografia.com/og-image.jpg" />
		<meta data-shell property="og:image:width" content="1200" />
		<meta data-shell property="og:image:height" content="630" />
		<meta data-shell property="og:locale" content="pt_PT" />
		<meta data-shell name="twitter:card" content="summary_large_image" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
