# Constrói o site (Vite + pré-render de todas as páginas) e envia-o para a
# DreamHost sempre que há um push para o main.
# Segredos do repositório: DH_HOST, DH_USER, DH_SSH_KEY e (opcional) DH_PATH.
name: Publicar na DreamHost
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'design.md', 'task.md', '.impeccable/**']
  workflow_dispatch:
concurrency: dreamhost
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Verificar tipos
        run: bun run typecheck
      - name: Instalar Chromium (pré-render)
        working-directory: packages/web
        run: bunx playwright install --with-deps chromium
      - name: Construir e pré-renderizar
        working-directory: packages/web
        run: bun run build
      - name: Verificar segredos
        id: check
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
        run: |
          if [ -z "$DH_HOST" ]; then echo "Segredos da DreamHost ainda não configurados: build OK, nada enviado."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Enviar por rsync
        if: steps.check.outputs.skip != '1'
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_SSH_KEY: ${{ secrets.DH_SSH_KEY }}
          DH_PATH: ${{ secrets.DH_PATH }}
          DH_KNOWN_HOSTS: ${{ secrets.DH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DH_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Pinned host key (no trust-on-first-use).
          printf '%s\n' "$DH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          TARGET="$DH_USER@$DH_HOST:${DH_PATH:-9mesesfotografia.com}/"
          # Pages whose HTML really changed (by content, not date), for IndexNow below.
          rsync -rcn --out-format='%n' --exclude '.DS_Store' --exclude '.well-known' --exclude '.dh-diag' \
            -e "$SSH" packages/web/dist/ "$TARGET" | grep -E '(^|/)index\.html$' > "$RUNNER_TEMP/changed.txt" || true
          rsync -rlptvz --delete --exclude '.DS_Store' --exclude '.well-known' --exclude '.dh-diag' \
            -e "$SSH" packages/web/dist/ "$TARGET"

      - name: Avisar Bing e outros motores (IndexNow)
        if: steps.check.outputs.skip != '1'
        # Bing (and the AI answers built on it) learn about changed pages right
        # away instead of waiting for a crawl. Never fails the deploy.
        continue-on-error: true
        run: |
          KEY=1e4c7010ac2e760dc354fa11acfd83a3
          URLS=$(sed -e 's#index\.html$##' -e 's#/$##' -e 's#^#https://9mesesfotografia.com/#' "$RUNNER_TEMP/changed.txt" \
            | sed 's#/$##; s#\.com$#.com/#' | jq -R . | jq -sc .)
          echo "Páginas alteradas: $(jq length <<<"$URLS")"
          [ "$(jq length <<<"$URLS")" -gt 0 ] || exit 0
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"9mesesfotografia.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://9mesesfotografia.com/$KEY.txt\",\"urlList\":$URLS}"
