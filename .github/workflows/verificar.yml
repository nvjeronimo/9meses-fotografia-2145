# Verifica cada pull request (por exemplo do Dependabot): tipos e build.
# Não publica nada; a publicação só acontece no push para main.
name: Verificar
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install
      - run: bun run typecheck
      - name: Build
        working-directory: packages/web
        run: bunx vite build
